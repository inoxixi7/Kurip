<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kurip app icon source. Render: ./img/render-icon.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#F3E2CA"/>
    </linearGradient>
    <linearGradient id="nut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8622E"/>
      <stop offset="1" stop-color="#8A3D18"/>
    </linearGradient>
    <clipPath id="nutClip">
      <path id="nutPath" d="M512 268 C574 284 660 344 706 428 C750 508 742 598 714 646 C678 712 598 746 512 746 C426 746 346 712 310 646 C282 598 274 508 318 428 C364 344 450 284 512 268 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5A3418" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle body on the macOS icon grid (824pt inside 1024) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>

  <!-- chestnut: kuri -->
  <use href="#nutPath" fill="url(#nut)"/>
  <path d="M290 604 C410 664 614 664 734 604 L734 760 L290 760 Z" fill="#E0BC8C" clip-path="url(#nutClip)"/>

  <!-- recording dot -->
  <circle cx="724" cy="300" r="54" fill="#FF3B30"/>
</svg>
